<!--
  Stage 5 (Tier 1) active response — the worked example.

  Story: Stage 3 showed Wazuh DETECTING an SSH brute force (the built-in
  rule 5763, "sshd: brute force trying to get access", which fires once
  enough per-failure 5760 events arrive from one source). Stage 5 now
  RESPONDS to it: when 5763 fires, the manager tells the agent that saw
  the attack to drop the attacker's IP with iptables, then lift the block
  again after a timeout.

  This is the file you edit. reload-response.sh injects everything between
  the START/END markers into the manager's ossec.conf (idempotently) and
  restarts the manager, validating first so a typo rolls back instead of
  taking the manager down. To add your OWN response (the student task),
  add another <active-response> block below, tied to a different rule.

  The pieces:
    <command>        names a responder script that ships with the agent
                     (firewall-drop = iptables DROP). timeout_allowed=yes
                     lets Wazuh auto-undo it after <timeout> seconds.
    <active-response> binds that command to a trigger:
      <location>local</location>  run on the agent that saw the event
                                   (so the block lands on the endpoint the
                                   attacker is hitting, not the manager)
      <rules_id>5763</rules_id>   the brute-force rule from Stage 3
      <timeout>60</timeout>       block for 60s, then auto-unblock

  firewall-drop reads the source IP from the alert, so the attacker
  (10.10.10.20) is what gets dropped on the endpoint (10.10.10.10).
-->
<ossec_config>

  <command>
    <name>firewall-drop-delab</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <command>firewall-drop-delab</command>
    <location>local</location>
    <rules_id>5763</rules_id>
    <timeout>60</timeout>
  </active-response>

  <!-- Add your own response below this line (bind a command to a
       different rule_id from your incident). -->

</ossec_config>
<!-- DELAB-STAGE5-AR-END -->
